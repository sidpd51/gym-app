# Full stack: postgres + Go backend + nginx-served frontend.
# One command from this directory:  docker compose up --build
#
# - App UI:      http://localhost:3000  (same-origin /api -> backend)
# - Backend API: http://localhost:8080  (direct access, local tools)
# - Postgres:   localhost:5432
#
# Data safety: the db volume is EXTERNAL and reuses the pre-existing
# `backend_gym-postgres-data` volume, so moving compose to the repo root
# does not orphan existing data. `docker compose down` never deletes it.
#
# Fresh install: after first boot, seed the OWNER user, e.g.
#   SEED_EMAIL=owner@example.com SEED_PASSWORD=ChangeMe123! \
#     docker compose --profile seed up seed
services:
  db:
    image: postgres:15-alpine
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - gym-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Secrets (JWT/COOKIE) come from backend/.env (gitignored).
    # Everything host-specific is overridden below for container networking.
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://gymuser:dev@db:5432/gymdb?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:3000
      BACKUP_DIR: /opt/gym-backups
      # In-container pg_dump/psql ship with the image; docker-exec mode is
      # only for Windows-host runs (see backend/.env).
      BACKUP_USE_DOCKER_EXEC: 0
      TZ: Asia/Kolkata
    volumes:
      - gym-backups:/opt/gym-backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # One-shot OWNER seed for fresh installs. Only runs explicitly:
  #   SEED_EMAIL=... SEED_PASSWORD=... docker compose --profile seed up seed
  # Skips (exit 0) when the user already exists.
  seed:
    build: ./backend
    profiles: [seed]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://gymuser:dev@db:5432/gymdb?sslmode=disable
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    entrypoint: ["/app/seed"]

volumes:
  gym-postgres-data:
    external: true
    name: backend_gym-postgres-data
  gym-backups:
