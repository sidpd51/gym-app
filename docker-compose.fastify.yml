# Full stack on the Fastify + MySQL backend: mysql + backend-fastify + nginx frontend.
#   docker compose -f docker-compose.fastify.yml up --build
#
# - App UI:      http://localhost:3000  (same-origin /api -> backend)
# - Backend API: http://localhost:8080
# - MySQL:       localhost:3306
#
# Fresh install: after first boot, seed the OWNER user:
#   SEED_EMAIL=owner@example.com SEED_PASSWORD=ChangeMe123! \
#     docker compose -f docker-compose.fastify.yml --profile seed up seed
#
# This is a NEW database (volume gym-mysql-data); it does not read the Postgres volume used by docker-compose.yml.
services:
  db:
    image: mysql:8.4
    container_name: gym-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gymdb
      MYSQL_USER: gymuser
      MYSQL_PASSWORD: dev
      MYSQL_ROOT_PASSWORD: dev-root
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--mysql-native-password=ON"]
    ports:
      - "3306:3306"
    volumes:
      - gym-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdev-root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend-fastify
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - backend-fastify/.env
    environment:
      DATABASE_URL: mysql://gymuser:dev@db:3306/gymdb
      FRONTEND_ORIGIN: http://localhost:3000
      BACKUP_DIR: /opt/gym-backups
      BACKUP_USE_DOCKER_EXEC: 0
      TZ: Asia/Kolkata
    volumes:
      - gym-backups:/opt/gym-backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  seed:
    build: ./backend-fastify
    profiles: [seed]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend-fastify/.env
    environment:
      DATABASE_URL: mysql://gymuser:dev@db:3306/gymdb
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    entrypoint: ["node", "dist/scripts/seed.js"]

volumes:
  gym-mysql-data:
  gym-backups:
